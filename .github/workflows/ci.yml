---
name: CI

on:
  push:
    branches:
      - master
    tags:
      - "*"
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tarball: ${{ steps.pack.outputs.tarball }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install PNPM
        uses: pnpm/setup@v3.2.0
        with:
          install: true
          require-lockfile: true

      - name: Lint
        run: pnpm run lint --type-check

      - name: Format check
        run: pnpm run format:check

      - name: Test
        if: false
        run: pnpm run test

      - name: Build
        run: pnpm run build

      - name: Generate production SBOM
        run: pnpm sbom --sbom-format cyclonedx --prod --out esbuild-plugin-json-cleaner.cdx.json

      - name: Pack
        id: pack
        run: |-
          TARBALL=$(pnpm pack | tail -n 1)
          echo "tarball=$TARBALL" >> $GITHUB_OUTPUT

      - name: Upload Tarball
        uses: actions/upload-artifact@v7.0.2
        with:
          archive: false
          path: ${{ steps.pack.outputs.tarball }}

      - name: Upload SBOM
        uses: actions/upload-artifact@v7.0.2
        with:
          archive: false
          path: esbuild-plugin-json-cleaner.cdx.json
          if-no-files-found: error

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    if: "github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')"
    environment: npm-publish
    permissions:
      contents: write # Required to create the GitHub release and upload the tarball
      id-token: write # Required for OIDC authentication with npm
    env:
      TARBALL: ${{ needs.build.outputs.tarball }}
    steps:
      - name: Download Tarball
        uses: actions/download-artifact@v8.0.2
        with:
          name: ${{ env.TARBALL }}

      - name: Download SBOM
        uses: actions/download-artifact@v8.0.2
        with:
          name: esbuild-plugin-json-cleaner.cdx.json

      - name: Install PNPM
        uses: pnpm/setup@v3.2.0
        with:
          runtime: node@^26
          version: 12

      - name: Publish on NPM
        run: pnpm stage publish --provenance --access public $TARBALL

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |-
          gh release create "$GITHUB_REF_NAME" "$TARBALL" esbuild-plugin-json-cleaner.cdx.json \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes ""

  jsr-publish:
    name: JSR Publish
    needs: build
    runs-on: ubuntu-latest
    if: "github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')"
    environment: npm-publish
    permissions:
      id-token: write # Required for OIDC authentication with JSR
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install PNPM
        uses: pnpm/setup@v3.2.0
        with:
          install: true
          require-lockfile: true

      - name: Publish on JSR
        run: pnpx jsr publish
